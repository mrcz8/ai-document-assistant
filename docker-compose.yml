services:
  app:
    build: .
    container_name: docmind-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-docmind}
      DB_USERNAME: ${DB_USERNAME:-docmind}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.45}
      CHUNK_SIZE: ${CHUNK_SIZE:-3200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-400}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    container_name: docmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-docmind}
      POSTGRES_USER: ${DB_USERNAME:-docmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-docmind} -d ${DB_DATABASE:-docmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  uploads:
